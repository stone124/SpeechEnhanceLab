services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: speechenhancelab:cpu
    working_dir: /app
    volumes:
      - ./src:/app/src
      - ./data:/app/data
      - ./models:/app/models
      - ./outputs:/app/outputs
    command: ["python", "src/prepare_data.py", "--help"]
